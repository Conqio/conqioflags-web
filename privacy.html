<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>ConQioFlags</title>

<link rel="apple-touch-icon" href="assets/icono-favoritos.png" sizes="180x180">
<link rel="stylesheet" href="assets/site.css">
<script>
(function () {
  function elegir() {
    var langs = ["es", "id", "de", "en", "fr", "it", "nl", "pl", "pt-br", "pt-pt", "vi", "tr", "ja", "ko"], cercanos = {"ca": "es", "gl": "es", "eu": "es"};
    var prefs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""];
    var i, j, l, base;
    for (i = 0; i < prefs.length; i++) {
      l = String(prefs[i]).toLowerCase();
      base = l.split("-")[0];
      if (langs.indexOf(l) > -1) return l;
      if (base === "pt" && langs.indexOf("pt-br") > -1 && langs.indexOf("pt-pt") > -1)
        return /^pt-br(-|$)/.test(l) ? "pt-br" : "pt-pt";
      for (j = 0; j < langs.length; j++) if (langs[j].split("-")[0] === base) return langs[j];
    }
    for (i = 0; i < prefs.length; i++) {
      base = String(prefs[i]).toLowerCase().split("-")[0];
      if (cercanos[base] && langs.indexOf(cercanos[base]) > -1) return cercanos[base];
    }
    return "en";
  }
  location.replace(elegir() + "/privacy.html" + location.hash);
})();
</script>
</head>

      </div>
